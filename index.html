<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="cotainer">
        <h2>Current Time</h2>
        <div class="boxes-container">
            <div class="boxes" id="hour">0</div>
            <div class="boxes" id="minute">0</div>
            <div class="boxes" id="second">0</div>
            <div class="time-zone">
                <p>AM</p>
                <p>PM</p>
            </div>
        </div>
        <div class="btn">
            <button class="start">Start the clock</button>
            <button class="stop">Stop the clock</button>
        </div>
    </div>


    <script src="script.js"></script>
</body>

</html>
